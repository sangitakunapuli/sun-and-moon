<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun & Moon</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="/" class="brand">☀ <span>sun <i>&</i> moon</span> ☾</a><span id="connection"></span></header>
<main><section id="lobby"><h1>Sun <em>&</em> Moon</h1><div class="cards"><article><span class="number">CREATE</span><h2>Create a room</h2><p>Choose your traveler. Your partner gets the other.</p><div class="roles"><button class="selected" data-role="sun">☀ Sun</button><button data-role="moon">☾ Moon</button></div><button id="create" class="primary">Create a room <span>↗</span></button></article><article><span class="number">JOIN</span><h2>Join a room</h2><p>Have a room code? Your adventure is waiting.</p><label for="code">ROOM CODE</label><input id="code" maxlength="6" placeholder="e.g. A1B2C3" autocomplete="off"><button id="join" class="secondary">Join room <span>↗</span></button></article></div><p id="error" role="alert"></p></section>
<section id="game" hidden><div class="navigation"><button id="home">← Home</button><button id="resume" hidden>Resume</button><nav id="levels" aria-label="Level progression"></nav></div><div class="gamebar"><div><span class="eyebrow" id="chapter"></span><h2 id="title"></h2></div><div class="room">ROOM <button id="copy" title="Copy room code"></button><span id="you"></span></div></div><div class="stage"><canvas id="canvas" width="1100" height="600" tabindex="0" aria-label="Cooperative platform game. Use arrow keys to move, space to jump, E to interact."></canvas><div id="overlay"><h2 id="overlay-title"></h2><p id="overlay-text"></p><button id="next" class="primary" hidden>Continue together →</button></div></div><div class="below"><p id="hint"></p><span id="stars"></span></div><footer><span><kbd>A</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>E</kbd> use power &nbsp; <kbd>R</kbd> return to checkpoint</span><button id="restart">Restart level</button></footer></section></main><script src="/polling.js"></script><script src="/app.js"></script></body></html>
